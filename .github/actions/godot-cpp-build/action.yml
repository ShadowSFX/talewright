name: Build godot-cpp
description: Build godot-cpp with the provided options.

inputs:
  bin:
    description: Path to the Godot binary.
    required: true
    type: string
  scons-flags:
    description: Additional SCons flags.
    type: string
  scons-cache:
    description: The SCons cache path.
    default: ${{ github.workspace }}/.scons_cache/
    type: string
  godot-cpp-branch:
    description: The godot-cpp branch.
    default: master
    type: string

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
        repository: godotengine/godot-cpp
        ref: ${{ inputs.godot-cpp-branch }}
        path: godot-cpp

    - name: Extract API
      shell: sh
      run: ${{ inputs.bin }} --headless --dump-gdextension-interface --dump-extension-api

    - name: SCons Build
      shell: sh
      env:
        SCONS_CACHE: ${{ inputs.scons-cache }}
      # Talewright: build from the runner's temp directory. The fork's longer workspace path makes godot-cpp's single
      # "ar" command exceed the kernel's 128 KiB argument limit (plan/UPSTREAM_PATCHES.md).
      run: |
        mv ./godot-cpp "$RUNNER_TEMP/godot-cpp"
        scons --directory="$RUNNER_TEMP/godot-cpp/test" "gdextension_dir=${{ github.workspace }}" ${{ inputs.scons-flags }}
